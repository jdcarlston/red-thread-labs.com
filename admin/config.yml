          label: Photo (like img/photo.jpg)
          widget: string
        - name: position
          label: Position
          widget: string
          default: 50% 50%
        - name: zoom
          label: Zoom
          widget: number
          value_type: float
          default: 1
        - name: color
          label: Keep full color
          widget: boolean
          required: false
      - &id022
