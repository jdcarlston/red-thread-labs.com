title: About Red Thread Labs
description: Red Thread Labs is a Salt Lake City-based organization that helps people practice and build long-lasting, authentic relationship skills, using evidence-based methods to find the patterns, practice new skills and shift behavior.
kicker: About
heading: Red Thread Labs
subtitle: We help people practice what is being preached.
