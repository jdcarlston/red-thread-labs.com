        label: Can’t wait until January?
        heading: Holiday Huddle
        lede: Stay close to each other through the holidays. Three coaching sessions over six weeks, plus text support between sessions for the moments that come up in real time.
        paragraphs:
          - $600. Couples who come together pay the same. Spots are limited.
        buttons:
          - {text: Book the Holiday Huddle, link: "https://square.link/u/fxH8RSeB", style: primary}
        note: Questions first? [Email JD](@email?subject=Holiday%20Huddle) or DM “HUDDLE” on Instagram.
      - type: faq
        heading: Questions
        items:
          - q: Do I need to bring a partner?
            a: No. Bring a partner, a friend or just yourself. If you come on your own, you’ll pair with others for short exercises. Partners, ’cules and friend groups are welcome too.
          - q: Will I have to share personal things?
            a: Only what you choose. Every exercise has an opt-out, and what’s shared in the room stays in the room.
          - q: Is this therapy?
            a: No. It’s skill practice with honest feedback. You are the scientist of your own life; the lab gives you the instruments.
          - q: Is dinner included?
            a: Yes. Let us know about dietary needs or allergies for everyone in your group when you reserve.
          - q: What’s the refund policy?
            a: Tickets are non-refundable, but they are transferable. If you can’t make it, you’re welcome to pass your seat to someone else. Just email [contact@red-thread-labs.com](@email) with their name so we can update the guest list.
          - q: Want to go deeper after?
            a: 1:1 coaching is available through our network of coaches. [Tell us what you’re working on](@email) and we’ll connect you with the right fit.
