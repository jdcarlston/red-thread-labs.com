# "Your guide, JD": the short About JD block on the Love Lab and Level-Up pages.
aboutJd:
  heading: Your guide, *JD*
  image: img/jd-lighting-candles.jpg
  alt: JD Carlston lighting candles at a Love Lab dinner
  paragraphs:
    - "**JD Carlston is a Human Engineer.** She spent more than twenty years leading engineering teams and architecture, most recently as Director of Product Engineering at Stack Overflow. Now she brings that same rigor to the patterns that shape how people love, work and belong: see the pattern, test one change, practice until it holds."
    - "She studied directly with Dr. Robert Dee McDonald, NLP architect, clinical researcher and co-founder of the [Telos Healing Center](https://teloscenter.com), and has woven his teaching together with attachment science, nervous-system work and decades of leading people into a method of her own: **Practice Labs**."
    - Since her teens she has coached, trained peer supporters, facilitated groups for volunteer and philanthropic organizations, and hosted gatherings; she is also a crisis responder, and has held rituals and ceremonies since 2012. JD and her husband Chick did this work on themselves first. At Red Thread Labs, we practice before we teach.
  links:
    - text: More about JD →
      link: /about/jd/
    - text: Her art, music and poetry at Madder Craft ↗
      link: https://maddercraft.com

