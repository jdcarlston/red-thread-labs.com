# Each section's id matches a link in the Practice Labs menu (_data/site.js), so keep the ids.
# Text uses Markdown: *italic*, **bold**, [link text](https://...).
title: Practice Labs
description: How Practice Labs work, and the kinds of labs Red Thread Labs runs, from evening Love Labs to Level-Up Sessions, retreats, and labs for teams, organizations, families and friends.
kicker: Practice Labs
heading: Practice Labs
subtitle: Space to explore, test and practice the skills that change how you connect.
header: {image: img/love-lab-writing.jpg, position: 60% 67%, zoom: 1.5, color: true}
rows:
  - style: band
    blocks:
      - type: text
        bare: true
        statement: Insight is a start. *Practice is what changes the loop.*
        paragraphs:
          - "Most of us already know what we’d like to do differently. A Practice Lab gives you the room to actually try it: with real people, honest feedback and enough repetition that the new way starts to feel like yours."
  - style: reading
    main: true
    blocks:
      - type: steps
        id: how-it-works
        label: How it works
        heading: The flow of a lab
        paragraphs:
          - Every lab, from a two-hour evening to a multi-day immersion, moves through the same three steps. You come as the scientist of your own life. We bring the instruments.
        items:
          - num: "01"
            title: See
            text: We settle in and set clear agreements. Then a short teaching names one loop, where it comes from and what the research says about it. Every exercise has an opt-out, and what’s shared stays in the room.
          - num: "02"
            title: Shift
            text: Guided exercises, with a partner or a small group, let you test a new move. You notice what happens in your body and in the other person, and get honest feedback.
          - num: "03"
            title: Prove
            text: You leave with one practice to keep testing in your life, so the change holds after the room is gone.
      - type: cards
        id: labs
        label: Labs & workshops
        heading: Group labs, in person
        paragraphs:
          - Small rooms, real people, and a different focus for each kind of lab.
        items:
          - id: love-lab
            label: Next lab · January
            title: The Love Lab
            text: An interactive evening for noticing the patterns underneath how you give and receive love, then practicing something different. Singles, couples and friends welcome.
            button: The Love Lab
            link: /love/
          - id: reinvention-labs
            label: Coming soon
            title: Reinvention Labs
            text: "For people rebuilding after a big change: a divorce, a move, a new chapter of work or life. We map the loops that came with the old life and practice the ones you want to carry into the new one."
            button: Ask about Reinvention Labs
            link: /contact/
          - id: crucibles
            label: By application
            title: Crucibles
            text: Multi-day immersions for people ready to go deep. Like carbon under heat and pressure, a small group, a held place and days of practice turn insight into who you are.
            button: Ask about Crucibles
            link: /contact/
      # Level-Up, retreats, teams and families: two cards to a row. Each card's id matches a link
      # in the Practice Labs menu (_data/site.js), so keep the ids.
      - type: cards
        columns: 2
        items:
          - id: level-up
            label: One-on-one and couples
            title: Level-Up Sessions
            text: A focused session to name the loop you keep running, shift it where talking alone can’t reach, and leave with something to practice the same day. Follow-ups and support between sessions, so the change has somewhere to land.
            button: Level-Up Sessions
            link: /level-up/
          - id: retreats
            label: Retreats & gatherings
            title: Dinners, retreats and ceremonies
            text: Special lab dinners, multi-day retreats, lunch-and-learns, and ceremonies for the turning points of a life. We plan the room, the food, the flow and the care, so the people in it can do the real work.
            button: Plan something with us
            link: /contact/
          - id: teams
            label: For teams & organizations
            title: The same loops run a team
            text: "How a team decides, disagrees and repairs runs on the same habits as a relationship. We bring Practice Labs and more than twenty years of engineering leadership to teams, leaders and organizations: working sessions, offsites, lunch-and-learns, leadership coaching and labs built around what your organization is actually facing."
            button: Talk about your team
            link: /contact/
          - id: families
            label: For families & friends
            title: Grow and learn together
            text: Change is easier when the people you love are learning it with you. We bring Practice Labs to your family or your circle of friends, in your home or a private gathering. You get a shared language, practice with each other in the room, and tools you can keep using together long after.
            button: Learn together
            link: /contact/
  - style: reading
    blocks:
      - type: text
        center: true
        heading: Not sure where to start?
        paragraphs:
          - Tell us what you’re working on. We’ll tell you honestly which lab fits, and if none of ours do, who might be the right fit.
        buttons:
          - {text: Book a free consultation, link: "@booking", style: primary}
          - {text: Send a message, link: /contact/, style: ghost}
