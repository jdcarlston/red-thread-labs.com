# Text uses Markdown: *italic*, **bold**, [link text](https://...).
title: Level-Up Sessions
description: Level-Up Sessions with JD Carlston. Find the hidden habits holding you back, and practice until the change holds.
kicker: Level-Up Sessions
heading: Level up, and get the *Love of your Life.*
subtitle: "*Practice Labs* to find the hidden habits holding you back."
header: {image: img/photo-embrace.jpg, position: 50% 30%, zoom: 1}
rows:
  - style: band
    blocks:
      - type: text
        bare: true
        statement: Notice what pulls you. *Choose what you pull in.*
        paragraphs:
          - The defaults you picked up as a kid are still running your life. You didn’t choose them, and they can be changed. When you do, you **level up**.
  - style: reading
    main: true
    blocks:
      - type: checklist
        heading: You know something needs to change.
        lede: "You’re here because you want to show up as a better you:"
        items:
          - Tired of being someone you don’t recognize in your relationships?
          - Tired of the same hurt in different packaging?
          - Ready to close the gap between who you are and who you know you can be?
      - type: checklist
        ordered: true
        label: This is for you if
        items:
          - You keep ending up in the same dynamic — different day, same feeling.
          - You know what you want but something keeps getting in the way of having it.
          - You may have done the reading, the therapy, the journaling — and still feel stuck in the same place.
          - You want to be someone your people can count on — and you want to count on yourself.
          - You’re ready to stop explaining the problem and start living differently.
      - type: steps
        heading: See · Shift · Prove
        paragraphs:
          - The method is simple — three steps. Every Level-Up Session runs on them.
        items:
          - {num: "01", title: See, text: Name the loop that keeps running your love life.}
          - {num: "02", title: Shift, text: "Change how that loop runs, where talking alone can’t reach."}
          - {num: "03", title: Prove, text: Practice with real people until the change holds.}
      - type: checklist
        ordered: true
        heading: What you walk away with
        paragraphs:
          - A Level-Up Session works directly with the parts of you that talking won’t reach. It draws on NLP and The Destination Method, developed by Dr. Robert Dee McDonald at the [Telos Healing Center](https://teloscenter.com). You don’t need to understand how it works. You just need to show up, curious.
        listLabel: After a session
        items:
          - "**The thing you keep doing — named in one sentence.** Clear, specific, yours. Not a diagnosis. A starting point."
          - "**A real shift, not a new idea.** Something actually different in how that part of you is running — not advice to try later, a change you can feel now."
          - "**More room to move.** More room to choose. More room to be who you actually want to be in the moments that matter most."
      - type: include
        name: about-jd
      - type: photos
        images:
          - {image: img/couple1.jpg, alt: "JD and Chick standing together, dressed up, in a dark wood-paneled room"}
          - {image: img/couple2.jpg, alt: "JD and Chick sitting close in a window seat lit red through stained glass"}
          - {image: img/couple3.jpg, alt: "JD and Chick dancing in green outfits on a wide desert flat under an evening sky"}
          - {image: img/couple4.jpg, alt: "JD in a pink bunny-ear hood and Chick in a green dinosaur hood, laughing in a selfie"}
