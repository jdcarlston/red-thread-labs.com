# Research Library clusters, in the order they appear on /library/.
# Each entry names its cluster by id.
# quadrant and evidence are the Research Radar defaults for the cluster's pages (a page can set its own):
#   quadrant: i (inner experience), it (body & behavior), we (relationship & culture), its (systems & structures)
#   evidence: research (studies), practice (clinical or practitioner work), tradition (philosophy, contemplative, story)
# Held back for now: the esoteric cluster (not on this site).

- id: attachment
  quadrant: we
  evidence: research
  short: Attachment
  title: Attachment & bonding
  blurb: How early bonds shape the way we reach for each other, and the research showing those patterns can change.
- id: relationships
  quadrant: we
  evidence: practice
  short: Relationships
  title: Relationships, desire & connection
  blurb: The researchers and clinicians who study how partners, families and friends stay close, fall apart, and find their way back.
- id: nervous-system
  quadrant: it
  evidence: research
  short: Nervous system
  title: Nervous system & neuroscience
  blurb: What the body and brain are doing when we feel safe, threatened, or in love, and why practice changes them.
- id: therapy
  quadrant: i
  evidence: practice
  short: Therapy & emotion
  title: Therapy & emotional skill
  blurb: The clinicians and researchers whose work on the whole person runs through every lab.
- id: change-work
  quadrant: i
  evidence: practice
  short: Change work
  title: NLP & change work
  blurb: The practitioners who mapped how people change, and how to make change last.
- id: perception
  quadrant: it
  evidence: research
  short: Perception
  title: Perception & the predictive brain
  blurb: How the brain builds the world we experience, and why that means our maps of people can be redrawn.
- id: systems
  quadrant: its
  evidence: research
  short: Systems & mind
  title: Systems, logic & mind
  blurb: "The systems thinkers behind our engineering side: levels, loops, maps and patterns."
- id: philosophy
  quadrant: we
  evidence: tradition
  short: Philosophy of love
  title: Philosophy of love & the person
  blurb: The thinkers who defined love as something we do, and the person as someone to meet, never to use.
- id: contemplative
  quadrant: i
  evidence: tradition
  short: Contemplative
  title: Contemplative & wisdom traditions
  blurb: Teachers of presence, letting go and attention, from many traditions.
- id: mythopoetic
  quadrant: we
  evidence: tradition
  short: Myth & story
  title: Myth & story
  blurb: The stories and maps that help people see their own changes as a journey with a shape.
- id: facilitation
  quadrant: its
  evidence: practice
  short: Facilitation
  title: Facilitation, strategy & original work
  blurb: How we hold a room, make decisions together, and map where we are, including JD’s own methods.
